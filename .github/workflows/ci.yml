name: CI

# main push는 deploy.yml이 같은 확인(typecheck·test·build)을 거쳐 게시한다
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 같은 PR에 새 커밋을 올리면 앞 실행을 멈춘다
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:seo
      - run: npm run build
