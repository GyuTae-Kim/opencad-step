<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OpenCAD STEP 뷰어 · STEP(.stp·.step) 3D 모델 보기</title>
    <meta name="description" content="STEP(.stp·.step) 3D CAD 모델을 설치 없이 브라우저에서 여는 무료 뷰어입니다. AP203·AP214·AP242 B-rep, 조립 제품 나무, 색, 단위, 두 점 측정, PNG 저장을 지원하며 파일은 서버로 보내지 않습니다." />
    <meta name="theme-color" content="#232830" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OpenCAD STEP 뷰어" />
    <meta property="og:description" content="STEP(.stp·.step) 3D 모델을 브라우저에서 바로 보는 무료 뷰어. 파일은 이 컴퓨터 밖으로 나가지 않습니다." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html,body{margin:0;height:100%}
      .boot{max-width:760px;margin:auto;padding:32px 20px;font:15px/1.7 system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#1d2530}
      .boot a{color:#1f6fd1}
      @media (prefers-color-scheme:dark){body{background:#1e232a}.boot{color:#e8ebf0}.boot a{color:#8cc5ff}}
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 앱이 준비되면 같은 내용을 안내하는 시작 화면으로 바뀝니다. -->
      <main class="boot">
        <h1>OpenCAD STEP 뷰어</h1>
        <p>STEP(ISO 10303-21, AP203·AP214·AP242) 3D CAD 파일(.stp·.step·.p21)을 설치나 회원가입 없이 브라우저에서 엽니다.
          조립 제품 나무, 부품 색, 단위, 파일 머리 정보를 보고, 부품을 고르거나 숨기고, 두 점 거리를 재고, 화면을 PNG로 저장할 수 있습니다.</p>
        <p>파일은 서버로 보내지 않고 이 브라우저 안에서 읽고 그립니다. JavaScript와 WebGL2를 지원하는 최신 브라우저가 필요합니다.</p>
        <p><a href="https://gyutae-kim.github.io/opencad">OpenCAD 도구 모음</a> · <a href="https://github.com/GyuTae-Kim/opencad-step">소스 코드(MIT)</a></p>
      </main>
    </div>
    <noscript>이 뷰어는 JavaScript가 필요합니다.</noscript>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
